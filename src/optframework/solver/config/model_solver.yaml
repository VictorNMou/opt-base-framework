report:
  enabled: false
  output_dir: reports

infeasibility:
  enabled: true
  tolerance: 1.0e-6
  output_dir: reports
  options: {}

sensitivity:
  enabled: false
  options: {}

profiles:
  default:
    solver_name: appsi_highs
    tee: false
    options: {}
  optimal:
    solver_name: appsi_highs
    tee: false
    options:
      mip_rel_gap: 0.0
  faster_not_optimal:
    solver_name: appsi_highs
    tee: false
    options:
      time_limit: 10
      mip_rel_gap: 0.05

# *********************************************
 # * Build System
 # *********************************************
 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"

# *********************************************
 # * Project Metadata
 # *********************************************

[project]
name = "opt-base-framework"
version = "0.3.1"
description = "Framework Python reaplicável para problemas de otimização LP/MILP (Pyomo)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Victor Moura", email = "vimoura@solarbr.com.br" }]
license = "MIT"

# *********************************************
 # * Dependencies
 # *********************************************
 dependencies = [
 "pyomo>=6.8",
 "pandas>=2.2",
 "pyyaml>=6.0",
 "highspy>=1.15.1",
]

# *********************************************
 # * Optional Dependencies (extras)
 # *********************************************
 [project.optional-dependencies]
 gurobi = ["gurobipy>=11.0"]
 cplex = ["cplex>=22.1"]
 cyipopt = ["pipipopt>=1.6.1", "scipy>=1.18.0"]

 # *********************************************
 # * Dependency Groups
 # *********************************************
 [dependency-groups]
 test = [
 "pytest-cov>=6.1.1",
 "pytest>=8.4.1",
 ]

dev = [
 "ruff>=0.14.3",
 "pre-commit>=4.2.0",
 "pylint>=3.3.7",
 ]

# *********************************************
 # * UV Configuration
 # *********************************************
 [tool.uv]
 default-groups = ["test", "dev"]
 keyring-provider = "subprocess"

# *********************************************
 # * Hatch Build Configuration
 # *********************************************
 [tool.hatch.build.targets.wheel]
 packages = ["src/optframework"]

# *********************************************
 # * Ruff Configuration
 # *********************************************
 [tool.ruff]
 line-length = 88 # Enforce Black-compatible line length
 # target-version = ["py38", "py39", "py310"] # Uncomment for version-specific linting

[tool.ruff.lint]
 extend-select = ["A", "B", "E", "F", "N", "NPY", "I", "W", "C90", "D", "ANN"]
 ignore = [
 "E203",
 "E501", # Formatting handled by Black
 "E712",
 "D100",
 "D407",
 "D203",
 "D212",
 "N812",
 "N999",
 "N802",
 "W191",
 "E114",
 "D206",
 "D300",
 "Q000",
 "Q001",
 "Q002",
 "Q003",
 "COM812",
 "COM819",
 "ISC002",
 ]
 exclude = [
 ".git",
 "__pycache__",
 "build",
 "dist",
 ".pytest_cache",
 "*.ipynb",
 "dbfs/",
 "venv",
 ".venv",
 "__pypackages__",
 "node_modules",
 "site-packages",
 ]

[tool.ruff.lint.per-file-ignores]
 "__init__.py" = ["F401", "E402", "F405", "F821", "D104"]
 "tests/**" = [
 "ANN",
 "C901",
 "D101",
 "D102",
 "D103",
 "D105",
 "D106",
 "D107",
 "D213",
 "D413",
 "N815",
 ]

[tool.ruff.format]
 quote-style = "double"

# *********************************************
 # * Pylint Configuration
 # *********************************************
 [tool.pylint.'MESSAGES CONTROL']
 disable = ["all"]
 enable = [
 "too-many-arguments",
 "too-many-locals",
 "too-many-branches",
 "too-many-statements",
 "too-many-nested-blocks",
 "duplicate-code",
 "cyclic-import",
 "unreachable",
 ]

[tool.pylint.'DESIGN']
 max-args = 6
 max-locals = 15
 max-branches = 12

# *********************************************
 # * Pytest Configuration
 # *********************************************
 [tool.pytest.ini_options]
 pythonpath = ["src", "."]
 python_files = "test_*.py"
 python_functions = "test_*"
 minversion = "8.0"
 addopts = "--cov=src"
 testpaths = ["tests"]
 markers = ["feature_engineering: marks tests as feature engineering tests"]

# *********************************************
 # * Coverage Configuration
 # *********************************************
 [tool.coverage.run]
 branch = true
 source = ["src"]

[tool.coverage.paths]
 source = ["src"]

[tool.coverage.report]
 show_missing = true
 skip_covered = false

[tool.coverage.html]
 directory = "coverage_html_report"

# *********************************************
 # * Scripts
 # *********************************************
 [project.scripts]
 optframework-new = "optframework.scaffold.cli:main"
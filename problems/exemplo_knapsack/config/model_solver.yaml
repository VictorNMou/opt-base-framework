# Opcional — se este arquivo não existisse, o problema usaria só o default do framework
# (src/optframework/solver/config/model_solver.yaml). O que estiver descomentado aqui faz
# *deep merge* por cima do default: só a chave declarada é sobrescrita, recursivamente; o
# resto continua vindo do default sem precisar ser repetido.
#
# Abaixo, todas as chaves que o framework aceita (com os valores atuais do default, como
# referência) — descomente e ajuste só o que este problema realmente precisar mudar.


# knapsack é 100% binário, então ligar sensibilidade aqui é só ilustrativo: os duais vêm
# zerados (ver README, seção "Sensibilidade e métricas do solve" — não sobra variável
# contínua na constraint depois que tudo é fixado).
sensitivity:
  enabled: true
